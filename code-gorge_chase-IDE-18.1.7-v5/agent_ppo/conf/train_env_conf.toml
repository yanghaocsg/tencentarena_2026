[env_conf]
# Maps used for training. Only Map 1 is provided for the junior high school group in this competition.
# 训练使用的地图。本次比赛初中组仅提供1号地图。
map = [1]

# Whether to randomly select maps. Only one map is provided for this competition, simply keep the setting as 'false'.
# 是否随机抽取地图。布尔值，true表示每局从配置的地图中中随机抽取一张，false表示按顺序抽取地图训练。本次比赛仅提供一张地图，保持false即可。
map_random = false

# Number of treasures. Range: 0~10. in each round, treasure will be randomly generated in accordance with the configure.
# 宝箱数量。可配置范围为0～10，每局将按照配置数量在道路上随机生成宝箱。
treasure_count = 10

# Number of speed buffs. Range: 0~2. In each round, buffs will be randomly generated on the road according to the configured.
# 加速buff数量。可配置范围为0～2，每局将按照配置数量在道路上随机生成buff。
buff_count = 2

# Speed buff refresh time. The time required to regenerate the buff after it is picked up. Range: 1~500.
# 加速buff刷新时间。buff被拾取后重新生成所需时间，单位为步数。可配置范围1～500。
buff_cooldown = 200

# Space shuttle talent cooldown steps. After casting, space shuttle enters cooldown and reactivates when cooldown ends. Range: 100~2000.
# 空间穿梭技能冷却步数，空间穿梭在施放后会进入冷却状态，冷却状态结束后重新激活。可配置范围为100~2000。
talent_cooldown = 100

# Second monster appearance interval. Steps after start before the second monster appears. Range: -1, 11~2000. -1 means random value in 11~2000.
# 第二个怪物出现间隔。即开局多少步后，出现第二个怪物。可配置范围为-1,11～2000。-1即为在11～2000范围内随机生成对应配置。
monster_interval = 300

# Monster speed boost time. Steps after start before monster movement speed increases by one. Range: -1, 1~2000. -1 means random value in 1~2000.
# 怪物加速增益时间。即开局多少步后，怪物移动速度增加一格，可配置范围-1,1～2000。-1即为在1～2000范围内随机生成对应配置。
monster_speedup = 500

# Maximum steps. The task ends when the predicted steps in a single round reach the maximum. Range: 1~2000.
# 最大步数，单局任务预测步数达到最大步数时，任务结束。可配置范围为1～2000。
max_step = 1000
